name: iOS CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      XCODEGEN_VERSION: "2.33.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode availability
        run: |
          echo "Xcode version: $(xcodebuild -version | head -1)"
          XCODE_PATH=$(xcode-select -p)
          echo "Xcode path: $XCODE_PATH"
          if [ ! -d "$XCODE_PATH" ]; then
            echo "ERROR: Xcode not found at $XCODE_PATH"
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project and scheme configuration
        run: |
          echo "=== 1. Checking BusinessCardOrganizer.xcodeproj ==="
          if [ ! -d "BusinessCardOrganizer.xcodeproj" ]; then
            echo "ERROR: BusinessCardOrganizer.xcodeproj was not generated!"
            exit 1
          fi

          echo "=== 2. Checking available schemes and targets ==="
          SCHEMES=$(xcodebuild -list -project BusinessCardOrganizer.xcodeproj)
          echo "$SCHEMES"
          if ! echo "$SCHEMES" | grep -q "BusinessCardOrganizer"; then
            echo "ERROR: Scheme 'BusinessCardOrganizer' not found in project!"
            exit 1
          fi
          if ! echo "$SCHEMES" | grep -q "BusinessCardOrganizerTests"; then
            echo "ERROR: Target 'BusinessCardOrganizerTests' not found in project!"
            exit 1
          fi
          if ! echo "$SCHEMES" | grep -q "BusinessCardOrganizerUITests"; then
            echo "ERROR: Target 'BusinessCardOrganizerUITests' not found in project!"
            exit 1
          fi

          echo "=== 3. Structurally inspecting scheme TestAction via Python XML ==="
          python3 - <<'PY'
          import os, sys
          import xml.etree.ElementTree as ET

          scheme_path = "BusinessCardOrganizer.xcodeproj/xcshareddata/xcschemes/BusinessCardOrganizer.xcscheme"
          if not os.path.isfile(scheme_path):
              print(f"ERROR: Shared scheme file not found at {scheme_path}")
              sys.exit(1)

          try:
              tree = ET.parse(scheme_path)
              root = tree.getroot()
          except Exception as e:
              print(f"ERROR: Failed to parse XML at {scheme_path}: {e}")
              sys.exit(1)

          test_action = root.find("TestAction")
          if test_action is None:
              print(f"ERROR: No <TestAction> element found in {scheme_path}")
              sys.exit(1)

          testables = test_action.find("Testables")
          if testables is None:
              print(f"ERROR: No <Testables> container found inside <TestAction> in {scheme_path}")
              sys.exit(1)

          discovered = []
          for ref in testables.findall("TestableReference"):
              name = ref.get("BlueprintName")
              if not name:
                  buildable = ref.find("BuildableReference")
                  if buildable is not None:
                      name = buildable.get("BlueprintName")
              if name:
                  discovered.append(name)

          print(f"Discovered test targets in TestAction: {discovered}")

          expected = {"BusinessCardOrganizerTests", "BusinessCardOrganizerUITests"}
          missing = expected - set(discovered)
          if missing:
              print(f"ERROR: Missing expected test targets in TestAction: {missing}")
              sys.exit(1)

          print("SUCCESS: Both test targets are properly configured in scheme TestAction.")
          PY

      - name: List available simulators
        run: xcrun simctl list devices available | head -40

      - name: Select available iOS simulator
        run: |
          xcrun simctl list devices available -j > /tmp/simulators.json
          python3 - <<'PY' > /tmp/simulator_selected.txt || true
          import json, sys
          with open('/tmp/simulators.json') as f:
              data = json.load(f)
          for runtime, devices in data['devices'].items():
              for d in devices:
                  if d['name'].startswith('iPhone') and d.get('isAvailable', False):
                      print(f'{d["name"]}|{d["udid"]}|{runtime}')
                      sys.exit(0)
          sys.exit(1)
          PY
          if [ ! -s /tmp/simulator_selected.txt ]; then
            echo "ERROR: No iPhone simulator available"
            xcrun simctl list devices available
            exit 1
          fi
          SELECTED=$(cat /tmp/simulator_selected.txt)
          SIM_NAME=$(echo "$SELECTED" | cut -d'|' -f1)
          SIM_UDID=$(echo "$SELECTED" | cut -d'|' -f2)
          SIM_RUNTIME=$(echo "$SELECTED" | cut -d'|' -f3)
          echo "Selected simulator: $SIM_NAME ($SIM_UDID) runtime: $SIM_RUNTIME"
          echo "SIM_NAME=$SIM_NAME" >> $GITHUB_ENV
          echo "SIM_UDID=$SIM_UDID" >> $GITHUB_ENV
          echo "SIM_RUNTIME=$SIM_RUNTIME" >> $GITHUB_ENV
      - name: Build for iOS Simulator (no code signing)
        run: |
          set -o pipefail
          xcodebuild -project BusinessCardOrganizer.xcodeproj \
            -scheme BusinessCardOrganizer \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-output.log

      - name: Run unit and UI tests
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult test-output.log
          xcodebuild test -project BusinessCardOrganizer.xcodeproj \
            -scheme BusinessCardOrganizer \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test-output.log

      - name: Publish test execution summary
        if: always()
        run: |
          if [ -f test-output.log ]; then
            echo "### Test Execution Log (Last 100 lines)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 100 test-output.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: |
            build-output.log
            test-output.log
            ~/Library/Developer/Xcode/DerivedData/**/Build/Logs/*.xcactivitylog
            ~/Library/Developer/Xcode/DerivedData/**/Build/Intermediates.noindex/**/*.xcactivitylog
          if-no-files-found: warn

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          if-no-files-found: warn

      - name: Upload simulator app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/BusinessCardOrganizer.app
          retention-days: 7