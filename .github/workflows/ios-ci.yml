name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
      XCODEGEN_VERSION: "2.33.0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Xcode availability
        run: |
          echo "Xcode version: $(xcodebuild -version | head -1)"
          if [ ! -d "/Applications/Xcode_15.4.app" ]; then
            echo "ERROR: Xcode 15.4 not found at /Applications/Xcode_15.4.app"
            exit 1
          fi

      - name: Install XcodeGen
        run: |
          brew install xcodegen@${XCODEGEN_VERSION} || brew upgrade xcodegen@${XCODEGEN_VERSION} || true
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List available simulators
        run: xcrun simctl list devices available | head -40

      - name: Verify simulator availability
        run: |
          SIM_NAME="iPhone 15"
          SIM_STATE=$(xcrun simctl list devices available | grep -m1 "$SIM_NAME" || true)
          if [ -z "$SIM_STATE" ]; then
            echo "ERROR: Simulator '$SIM_NAME' not available"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Simulator '$SIM_NAME' is available"

      - name: Build for iOS Simulator (no code signing)
        run: |
          xcodebuild -project BusinessCardOrganizer.xcodeproj \
            -scheme BusinessCardOrganizer \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit and UI tests
        run: |
          xcodebuild test -project BusinessCardOrganizer.xcodeproj \
            -scheme BusinessCardOrganizer \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Logs/*.xcactivitylog
            ~/Library/Developer/Xcode/DerivedData/**/Build/Intermediates.noindex/**/*.xcactivitylog

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/TestAttachments/**
            ~/Library/Developer/Xcode/DerivedData/**/Logs/Test/*.xcresult

      - name: Upload simulator app bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-app
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphonesimulator/BusinessCardOrganizer.app
          retention-days: 7