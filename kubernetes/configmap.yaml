apiVersion: v1
kind: ConfigMap
metadata:
  name: business-card-organizer-config
  labels:
    app: business-card-organizer
    component: config
data:
  # Environment configuration
  NODE_ENV: "production"
  # Application settings
  API_VERSION: "v1"
  # Feature flags
  ENABLE_ANALYTICS: "true"
  ENABLE_RATE_LIMITING: "true"
  ENABLE_CIRCUIT_BREAKER: "true"
  
  # Server settings
  PORT: "8000"
  # CORS settings
  CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
  
  # Feature flags
  ENABLE_PREVIEWS: "true"
  ENABLE_USER_INTERFACE_SCANNING: "false"
  ENABLE_HARDENED_RUNTIME: "false"
  
  # Swift compilation settings
  SWIFT_VERSION: "5.9"