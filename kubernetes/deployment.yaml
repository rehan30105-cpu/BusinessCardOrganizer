apiVersion: apps/v1
kind: Deployment
metadata:
  name: business-card-organizer-backend
  labels:
    app: business-card-organizer
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: business-card-organizer
      component: backend
  template:
    metadata:
      labels:
        app: business-card-organizer
        component: backend
    spec:
      # Service account for backend operations
      serviceAccountName: backend-service-account
      
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      
      # Container configuration
      containers:
        - name: backend
          image: business-card-organizer-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          
          # Resource requests and limits
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          
          # Environment variables from ConfigMap
          envFrom:
            - configMapRef:
                name: business-card-organizer-config
          
          # Additional environment variables
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: NODE_ENV
              value: "production"
          
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          
          # Startup probe
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 12
          
          # Security: drop volatile and kernel caps
          securityContext:
            allowPrivilegeEscalation: false
            procMount: ReadOnly
          
          # Readiness from ConfigMap
          env:
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: business-card-organizer-config
                  key: NODE_ENV