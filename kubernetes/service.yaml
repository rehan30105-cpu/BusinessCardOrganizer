apiVersion: v1
kind: Service
metadata:
  name: business-card-organizer-backend
  labels:
    app: business-card-organizer
    component: backend
spec:
  type: ClusterIP
  selector:
    app: business-card-organizer
    component: backend
  ports:
    - name: http
      protocol: TCP
      port: 80
      target: 8000
    - name: https
      protocol: TCP
      port: 443
      target: 8000